buildscript {
    ext.kotlin_version = '2.0.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project.file('libs')
        }
    }
}

ext {
    appId = "autoandshare.headvr"
    versionName = '3.4.0'
    versionCode = 3040000
    libvlcVersion = '3.4.0'
    medialibraryVersion = '0.9.0'
    minSdkVersion = 21
    targetSdkVersion = 29
    compileSdkVersion = 29
    androidxLegacyVersion = '1.0.0'
    androidxCoreVersion = '1.3.2'
    appCompatVersion = '1.2.0'
    lifecycleVersion = '2.3.1'
    androidxPreferencesVersion = '1.1.1'
    androidxVersion = '1.1.0'
    androidxActivityVersion = '1.2.2'
    androidxFragmentVersion = '1.3.3'
    androidxAnnotationVersion = '1.2.0'
    androidxRecyclerviewVersion = '1.2.0'
    androidxMediaVersion = '1.1.0'
    androidxLeanbackVersion = '1.0.0'
    androidxMaterialVersion = '1.3.0'
    constraintLayoutVersion = '2.0.4'
    viewPager2Version = "1.0.0"
    archVersion = '2.1.0'
    roomVersion = '2.3.0'
    pagingVersion = '2.1.2'
    junitVersion = '4.13'
    mockito = '2.25.0'
    retrofit = '2.6.4'
    moshi = '1.8.0'
    powerMock = '2.0.2'
    espressoVersion = '3.3.0'
    livedataTest = '1.2.0'
    robolectric = '4.3.1'
    mockk = '1.9.3'
    supportTest = '1.1.2'
    orchestrator = '1.1.0'
    testCore = '1.3.0'
    kotlin_version = '2.0.20'
    kotlinx_version = '1.6.4'
}

apply plugin: 'com.android.library'

android {
    namespace 'autoandshare.headvr'
    compileSdkVersion rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation project(path: ':application:resources')
    testImplementation 'junit:junit:4.12'

    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    implementation files('libs/gvr-sdk-base-1.190.0.aar')
    implementation 'com.tencent:mmkv:1.2.8'

    api "org.videolan.android:libvlc-all:$rootProject.ext.libvlcVersion"
    api "org.videolan.android:medialibrary-all:$rootProject.ext.medialibraryVersion"

    implementation("com.squareup.okhttp3:okhttp:4.9.0")
}